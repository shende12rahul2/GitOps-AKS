name: terraform-apply

# Applies approved changes. Merges to main apply dev automatically; test and
# prod are applied with workflow_dispatch and gated by GitHub environment
# protection rules (required reviewers, main branch only). Layers always run in
# dependency order: foundation -> platform -> data.
on:
  push:
    branches: [main]
    paths: ["modules/**", "environments/dev/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, test, prod]
        required: true
      layer:
        description: Layer to apply
        type: choice
        options: [all, foundation, platform, data]
        default: all
      allow_destroy:
        description: Permit a plan that deletes resources (still blocked for protected types)
        type: boolean
        default: false
      confirm_protected_destroy:
        description: "To delete stateful resources (databases, vaults, storage, Redis) type <environment>/<layer>"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  # Never run two applies against the same environment at once.
  group: apply-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.17.1"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

jobs:
  apply:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      max-parallel: 1 # sequential, in the listed order
      matrix:
        layer: ${{ fromJSON((inputs.layer == '' || inputs.layer == 'all' || inputs.layer == null) && '["foundation","platform","data"]' || format('["{0}"]', inputs.layer)) }}
    # The GitHub environment holds the apply identity (vars.AZURE_CLIENT_ID) and
    # its protection rules (reviewers, wait timer, deployment branches).
    environment: ${{ inputs.environment || 'dev' }}
    env:
      TARGET_ENV: ${{ inputs.environment || 'dev' }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: environments/${{ inputs.environment || 'dev' }}/${{ matrix.layer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: only from main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Applies are only allowed from main."; exit 1
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: init
        run: terraform init -backend-config=backend.hcl -lockfile=readonly
      - name: plan
        run: |
          terraform plan -lock-timeout=10m -out=tfplan -no-color
          terraform show -json tfplan > plan.json
      - name: destroy guard
        env:
          ALLOW_DESTROY: ${{ inputs.allow_destroy || false }}
          CONFIRM: ${{ inputs.confirm_protected_destroy || '' }}
        run: |
          ../../../scripts/tf-plan-guard.sh plan.json "$TARGET_ENV" enforce \
            --allow-destroy "$ALLOW_DESTROY" \
            --confirm "$CONFIRM" \
            --expected "$TARGET_ENV/${{ matrix.layer }}" >> "$GITHUB_STEP_SUMMARY"
      - name: apply
        run: terraform apply -lock-timeout=10m -auto-approve tfplan
      - name: outputs (non-sensitive)
        run: terraform output -no-color >> "$GITHUB_STEP_SUMMARY"
