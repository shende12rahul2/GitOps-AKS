name: terraform-validate

# Static checks on every pull request and on main: formatting, init without a
# backend, validate, TFLint, offline mocked-provider tests and environment parity.
on:
  pull_request:
    paths: ["modules/**", "environments/**", "bootstrap/**", ".tflint.hcl", ".github/workflows/terraform-*.yml", "scripts/**"]
  push:
    branches: [main]
    paths: ["modules/**", "environments/**", "bootstrap/**", ".tflint.hcl"]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.17.1"

jobs:
  fmt-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: Environment parity (root code identical across dev/test/prod)
        run: ./scripts/check-env-parity.sh
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the azurerm ruleset
        run: |
          tflint --init
          tflint --recursive --format=compact

  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        root:
          - bootstrap/terraform-backend
          - environments/dev/foundation
          - environments/dev/platform
          - environments/dev/data
          - environments/test/foundation
          - environments/test/platform
          - environments/test/data
          - environments/prod/foundation
          - environments/prod/platform
          - environments/prod/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: init (no backend, lock file enforced)
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -lockfile=readonly
      - name: validate
        working-directory: ${{ matrix.root }}
        run: terraform validate
      - name: offline tests (mocked provider)
        working-directory: ${{ matrix.root }}
        run: |
          if [ -d tests ]; then terraform test; else echo "no tests"; fi
