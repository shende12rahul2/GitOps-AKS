version: 2
updates:
  - package-ecosystem: pip
    directory: /libs/svc-common
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: docker
    directories: ["/services/*", "/tools/db-bootstrap", "/airflow"]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
