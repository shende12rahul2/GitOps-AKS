[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "svc-common"
version = "1.0.0"
description = "Shared runtime for the AKS POC microservices: config, JSON logging, Entra-auth PostgreSQL, Redis cache, Azure Files helpers, health and auth."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.2",
  "sqlalchemy==2.1.8",
  "psycopg[binary]==3.3.8",
  "redis==8.1.0",
  "redis-entraid==1.2.2",
  "azure-identity==1.27.0",
  "httpx==0.28.1",
  "email-validator==2.3.0",
  "prometheus-client==0.26.0",
]

[tool.setuptools.packages.find]
include = ["svc_common*"]
