{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "svc.serviceAccountName" . }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
  annotations:
    # Created before the migration hook Job (wave 0) and the Deployment (wave 1).
    argocd.argoproj.io/sync-wave: "-1"
    {{- if .Values.workloadIdentity.enabled }}
    azure.workload.identity/client-id: {{ include "svc.clientId" . | required "workloadIdentity.clientId (or global.workloadIdentities.<service>.clientId) is required" | quote }}
    {{- with .Values.global.tenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
