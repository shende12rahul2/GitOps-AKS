{{- if .Values.networkPolicy.enabled }}
# Who may call this service. The namespace has a default-deny policy
# (kubernetes/network-policies), so anything not listed here is dropped.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "svc.fullname" . }}-ingress
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "svc.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- with .Values.networkPolicy.allowFromServices }}
    - from:
        {{- range . }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
      ports:
        - { port: http, protocol: TCP }
    {{- end }}
    {{- if .Values.networkPolicy.allowFromAirflow }}
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: airflow }
          podSelector:
            matchExpressions:
              - { key: component, operator: In, values: [worker, triggerer] }
      ports:
        - { port: http, protocol: TCP }
    {{- end }}
    {{- if .Values.networkPolicy.allowFromIngress }}
    {{- if eq (dig "ingress" "mode" "agic" (.Values.global | default dict)) "agic" }}
    # Application Gateway reaches pod IPs directly (AGIC); source is the gateway subnet.
    - from:
        - ipBlock:
            cidr: {{ .Values.global.ingress.gatewaySubnetCidr | default "10.10.4.0/24" }}
      ports:
        - { port: http, protocol: TCP }
    {{- else }}
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress }
      ports:
        - { port: http, protocol: TCP }
    {{- end }}
    {{- end }}
    # Managed Prometheus (ama-metrics in kube-system) scrapes /metrics.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: http, protocol: TCP }
{{- end }}
