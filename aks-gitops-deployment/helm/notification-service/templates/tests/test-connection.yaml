# `helm test <release>`: calls the service through its ClusterIP Service using
# the service's own (allow-listed, digest-pinned) image.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "svc.fullname" . }}-test
  labels:
    {{- include "svc.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: probe
      image: {{ include "svc.image" . }}
      command:
        - python
        - -c
        - |
          import json, urllib.request
          url = "http://{{ include "svc.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.readinessPath }}"
          print(json.load(urllib.request.urlopen(url, timeout=10)))
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }
