{{- if .Values.keyVault.enabled }}
# Key Vault secrets mounted as files with this service's own workload identity.
# RBAC is scoped per secret in Terraform, so the identity can read nothing else.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "svc.fullname" . }}-kv
  labels:
    {{- include "svc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ include "svc.clientId" . | quote }}
    keyvaultName: {{ .Values.keyVault.name | default .Values.global.keyVaultName | required "keyVault.name or global.keyVaultName is required" | quote }}
    tenantId: {{ .Values.global.tenantId | required "global.tenantId is required" | quote }}
    objects: |
      array:
        {{- range .Values.keyVault.secrets }}
        - |
          objectName: {{ .objectName }}
          objectType: secret
          {{- with .fileName }}
          objectAlias: {{ . }}
          {{- end }}
        {{- end }}
{{- end }}
