apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: aks-poc-image-provenance
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])"
    - name: registries
      expression: "params.data.registries.split(',')"
  validations:
    - expression: "variables.containers.all(c, variables.registries.exists(r, c.image.startsWith(r)))"
      messageExpression: "'images must come from: ' + params.data.registries"
      reason: Forbidden
    - expression: "params.data.requireDigest != 'true' || variables.containers.all(c, c.image.contains('@sha256:'))"
      message: "images must be pinned by digest (repository@sha256:...)"
      reason: Forbidden
{{- range $ns, $p := .Values.policies }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-provenance-params
  namespace: {{ $ns }}
data:
  registries: {{ join "," (concat (list (printf "%s/" ($.Values.global.acrLoginServer | required "global.acrLoginServer is required"))) $p.extraRegistries) | quote }}
  requireDigest: {{ $p.requireDigest | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: aks-poc-image-provenance-{{ $ns }}
spec:
  policyName: aks-poc-image-provenance
  validationActions: [{{ $p.action }}]
  paramRef:
    name: image-provenance-params
    namespace: {{ $ns }}
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns }}
{{- end }}
