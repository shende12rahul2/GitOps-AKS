# db-bootstrap: PostgreSQL + Entra ID token endpoint only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: platform-jobs
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress
  namespace: platform-jobs
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    {{- include "np.dns" . | nindent 4 }}
    - to:
        - ipBlock: { cidr: {{ .Values.global.network.postgresSubnetCidr }} }
      ports:
        - { port: 5432, protocol: TCP }
    {{- include "np.internet443" . | nindent 4 }}
