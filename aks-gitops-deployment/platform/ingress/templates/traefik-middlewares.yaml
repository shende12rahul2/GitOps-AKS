{{- if eq .Values.global.ingress.mode "internal" }}
{{- $namespaces := list .Values.apps.namespace }}
{{- range $name, $a := .Values.admin }}{{- if $a.enabled }}{{- $namespaces = append $namespaces $a.namespace }}{{- end }}{{- end }}
{{- range $namespaces }}
---
# HSTS and hardening headers at the edge (internal mode). In AGIC mode the
# services add the same headers themselves.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: {{ . }}
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
{{- end }}
{{- end }}
