global:
  tenantId: ""
  keyVaultName: ""
  workloadIdentities: {}

namespace: airflow
serviceAccountName: airflow-kv-sync

# The official Airflow chart reads credentials from Kubernetes Secrets, and the
# CSI driver only materialises Secrets while a pod mounts the volume. This tiny
# always-on pod (pause image) keeps them present and rotated (2-minute poll).
syncPod:
  image:
    repository: mcr.microsoft.com/oss/kubernetes/pause
    digest: sha256:2b5d81a9d7f04299f45ed1b6822de018188f463914fcbf5592f39087c9adead1 # 3.10

# Key Vault secret -> Kubernetes Secret/key expected by the Airflow chart.
secrets:
  - { objectName: airflow-metadata-connection, secretName: airflow-metadata, key: connection }
  - { objectName: airflow-broker-url, secretName: airflow-broker-url, key: connection }
  - { objectName: airflow-fernet-key, secretName: airflow-fernet-key, key: fernet-key }
  - { objectName: airflow-api-secret-key, secretName: airflow-api-secret-key, key: api-secret-key }
  - { objectName: airflow-jwt-secret, secretName: airflow-jwt-secret, key: jwt-secret }
  - { objectName: airflow-webserver-secret-key, secretName: airflow-webserver-secret-key, key: webserver-secret-key }
  - { objectName: airflow-gitsync-ssh-key, secretName: airflow-gitsync-ssh, key: gitSshKey }
  - { objectName: airflow-oauth-client-secret, secretName: airflow-oauth, key: client-secret }
  - { objectName: internal-api-key, secretName: airflow-internal-api, key: INTERNAL_API_KEY }
