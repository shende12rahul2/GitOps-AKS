{{- $clientId := dig "airflow" "clientId" "" .Values.global.workloadIdentities | required "global.workloadIdentities.airflow.clientId is required" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  annotations:
    azure.workload.identity/client-id: {{ $clientId | quote }}
    azure.workload.identity/tenant-id: {{ .Values.global.tenantId | quote }}
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: airflow-kv
  namespace: {{ .Values.namespace }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ $clientId | quote }}
    keyvaultName: {{ .Values.global.keyVaultName | required "global.keyVaultName is required" | quote }}
    tenantId: {{ .Values.global.tenantId | required "global.tenantId is required" | quote }}
    objects: |
      array:
        {{- range .Values.secrets }}
        - |
          objectName: {{ .objectName }}
          objectType: secret
        {{- end }}
  secretObjects:
    {{- range .Values.secrets }}
    - secretName: {{ .secretName }}
      type: Opaque
      labels:
        app.kubernetes.io/managed-by: secrets-store-csi-driver
      data:
        - objectName: {{ .objectName }}
          key: {{ .key }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-kv-sync
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: airflow-kv-sync
    component: kv-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow-kv-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow-kv-sync
        component: kv-sync
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        runAsGroup: 65535
        seccompProfile: { type: RuntimeDefault }
      nodeSelector:
        workload-class: apps
      containers:
        - name: sync
          image: {{ printf "%s@%s" .Values.syncPod.image.repository .Values.syncPod.image.digest }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 20m, memory: 16Mi }
          volumeMounts:
            - name: kv
              mountPath: /mnt/kv
              readOnly: true
      volumes:
        - name: kv
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: airflow-kv
