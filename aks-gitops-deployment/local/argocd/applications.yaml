# Local GitOps: Argo CD on k3s syncs from the GitHub repository, exactly like
# AKS, but with local values. up.sh substitutes __REPO_URL__ and __REVISION__.
# Paths are relative to the root of the repository that contains this folder.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __REVISION__
    path: __PREFIX__local/infra
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: microservices-local
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: frontend
          - name: user-service
          - name: product-service
          - name: order-service
          - name: notification-service
  template:
    metadata:
      name: '{{ .name }}'
    spec:
      project: default
      source:
        repoURL: __REPO_URL__
        targetRevision: __REVISION__
        path: '__PREFIX__helm/{{ .name }}'
        helm:
          releaseName: '{{ .name }}'
          valueFiles:
            - ../../local/values/global.yaml
            - '../../local/values/{{ .name }}.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: apps
      syncPolicy:
        # Same behaviour as the AKS dev environment: Git wins, drift is reverted.
        automated: { prune: true, selfHeal: true }
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
