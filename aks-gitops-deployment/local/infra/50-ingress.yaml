# Same routing as AKS (one host, path-based) on k3s's built-in Traefik.
# *.localtest.me resolves to 127.0.0.1 in public DNS: no /etc/hosts edits needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: app.localtest.me
      http:
        paths:
          - { path: /api/users, pathType: Prefix, backend: { service: { name: user-service, port: { number: 8000 } } } }
          - { path: /api/products, pathType: Prefix, backend: { service: { name: product-service, port: { number: 8000 } } } }
          - { path: /api/orders, pathType: Prefix, backend: { service: { name: order-service, port: { number: 8000 } } } }
          - { path: /api/notifications, pathType: Prefix, backend: { service: { name: notification-service, port: { number: 8000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 8000 } } } }
