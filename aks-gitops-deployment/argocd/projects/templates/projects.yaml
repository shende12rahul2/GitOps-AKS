# Platform components: cluster-scoped resources allowed, platform namespaces only.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: Cluster foundation and shared platform services (owned by the platform team)
  sourceRepos:
    - {{ .Values.repoURL }}
    - {{ .Values.helmRepos.certManager }}
    - {{ .Values.helmRepos.traefik }}
    - {{ .Values.helmRepos.argocd }}
  destinations:
    {{- range list "apps" "airflow" "platform-jobs" "cert-manager" "ingress" "argocd" "kube-system" }}
    - server: https://kubernetes.default.svc
      namespace: {{ . }}
    {{- end }}
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
    - { group: "", kind: PersistentVolume }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy }
    - { group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding }
    - { group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration }
    - { group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration }
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: cert-manager.io, kind: ClusterIssuer }
    - { group: networking.k8s.io, kind: IngressClass }
  # Platform workloads may only change kube-system through this ConfigMap.
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
  roles:
    - name: devops-sync
      description: DevOps engineers may sync platform applications
      policies:
        - p, proj:platform:devops-sync, applications, sync, platform/*, allow
        - p, proj:platform:devops-sync, applications, get, platform/*, allow
  {{- with .Values.syncWindows }}
  syncWindows:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# Application workloads: namespace "apps" only, GitOps repo only, no cluster
# resources, no RBAC/quota/policy objects (those belong to the platform).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: The five microservices
  sourceRepos:
    - {{ .Values.repoURL }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: apps
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - { group: "", kind: ResourceQuota }
    - { group: "", kind: LimitRange }
    - { group: rbac.authorization.k8s.io, kind: Role }
    - { group: rbac.authorization.k8s.io, kind: RoleBinding }
    - { group: networking.k8s.io, kind: Ingress }
  orphanedResources:
    warn: true
  {{- with .Values.syncWindows }}
  syncWindows:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: airflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: Apache Airflow (official Helm chart)
  sourceRepos:
    - {{ .Values.repoURL }}
    - {{ .Values.helmRepos.airflow }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: airflow
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - { group: "", kind: ResourceQuota }
    - { group: "", kind: LimitRange }
    - { group: networking.k8s.io, kind: Ingress }
  {{- with .Values.syncWindows }}
  syncWindows:
    {{- toYaml . | nindent 4 }}
  {{- end }}
